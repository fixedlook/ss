name: Release Nebula Nested

# Builds the plugin on GitHub's runners and attaches main.js / manifest.json / styles.css to a
# release. BRAT needs those three as release *assets* with exactly those names — files in the repo
# tree are not enough.

on:
  push:
    tags: ["0.*", "v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the build to (defaults to the plugin version)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obsidian-nebula-nested
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Resolve tag
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$DISPATCH_TAG" ]; then
            echo "tag=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Nebula Nested $TAG" --notes "Built from $GITHUB_SHA"
          gh release upload "$TAG" \
            dist/main.js dist/manifest.json dist/styles.css --clobber
          echo "attached to $TAG:"
          gh release view "$TAG" --json assets --jq '.assets[] | "  \(.name)  \(.size) bytes"'
