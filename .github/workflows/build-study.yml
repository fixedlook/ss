name: build-motivewave-study
# Compiles the MotiveWave study against the MotiveWave SDK and commits the
# resulting .jar to dist/ so it can be imported into MotiveWave
# (Study > All Studies > Import) or dropped into the Extensions folder.
on:
  push:
    branches: [ arena/01a10698-ss ]
    paths:
      - 'MotiveWaveStudy/**'
      - '.github/workflows/build-study.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Fetch MotiveWave SDK
        run: |
          mkdir -p MotiveWaveStudy/lib
          url1="https://raw.githubusercontent.com/StaticNoiseLog/motive-wave-template/main/lib/local-jars/mwave_sdk.jar"
          url2="https://raw.githubusercontent.com/StaticNoiseLog/motive-wave-template/master/lib/local-jars/mwave_sdk.jar"
          url3="https://www.motivewave.com/sdk/mwave_sdk.jar"
          if   curl -fsSL "$url1" -o MotiveWaveStudy/lib/mwave_sdk.jar; then echo "sdk from $url1";
          elif curl -fsSL "$url2" -o MotiveWaveStudy/lib/mwave_sdk.jar; then echo "sdk from $url2";
          elif curl -fsSL "$url3" -o MotiveWaveStudy/lib/mwave_sdk.jar; then echo "sdk from $url3";
          else echo "::error::could not download the MotiveWave SDK"; exit 1; fi
          ls -la MotiveWaveStudy/lib/
          sha256sum MotiveWaveStudy/lib/mwave_sdk.jar

      - name: Compile study
        run: |
          set -o pipefail
          mkdir -p MotiveWaveStudy/build
          find MotiveWaveStudy/src -name '*.java' > /tmp/sources.txt
          echo "--- sources ---"; cat /tmp/sources.txt
          # The SDK is compiled for Java 19 (class file 63), so we target 19.
          javac -Xlint:all -encoding UTF-8 --release 19 \
                -cp MotiveWaveStudy/lib/mwave_sdk.jar \
                -d MotiveWaveStudy/build \
                @/tmp/sources.txt 2>&1 | tee MotiveWaveStudy/build/compile.log
          echo "--- compiled classes ---"
          find MotiveWaveStudy/build -name '*.class'

      - name: Package jars
        run: |
          set -e
          mkdir -p dist stage-cvd stage-exp
          # one jar per study, so importing one does not drag in the other
          (cd MotiveWaveStudy/build && find com -name 'CvdDivergenceStudy*.class' -exec cp --parents {} ../../stage-cvd/ \;)
          (cd MotiveWaveStudy/build && find com -name 'BidAskExporterStudy*.class' -exec cp --parents {} ../../stage-exp/ \;)
          jar --create --file dist/MNQ-CvdDivergence.jar -C stage-cvd com
          jar --create --file dist/MNQ-BidAskExporter.jar -C stage-exp com
          echo "--- MNQ-CvdDivergence.jar ---"
          jar --list --file dist/MNQ-CvdDivergence.jar
          echo "--- MNQ-BidAskExporter.jar ---"
          jar --list --file dist/MNQ-BidAskExporter.jar
          sha256sum dist/MNQ-CvdDivergence.jar dist/MNQ-BidAskExporter.jar | tee dist/SHA256SUMS.txt
          {
            echo "built: $(date -u +%FT%TZ)"
            echo "jdk:   $(javac -version 2>&1)"
            echo ""
            echo "--- javac output (-Xlint:all) ---"
            cat MotiveWaveStudy/build/compile.log
          } > dist/BUILD-LOG.txt

      - name: Commit artifacts back to the branch
        run: |
          git config user.name "arena-build-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f dist/MNQ-CvdDivergence.jar dist/MNQ-BidAskExporter.jar dist/SHA256SUMS.txt dist/BUILD-LOG.txt
          git commit -m "Build MotiveWave study jar [skip ci]" || { echo "nothing to commit"; exit 0; }
          git push
