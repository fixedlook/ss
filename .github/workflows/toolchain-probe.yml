name: toolchain-probe
on:
  push:
    branches: [ arena/01a10698-ss ]
    paths: [ '.github/workflows/toolchain-probe.yml' ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: compile probe
        run: |
          mkdir -p probe
          cat > probe/Probe.java <<'JAVA'
          public class Probe {
            public static void main(String[] a) { System.out.println("probe ok " + System.getProperty("java.version")); }
          }
          JAVA
          javac -d probe probe/Probe.java
          java -cp probe Probe
      - name: report back
        run: |
          mkdir -p build-ci
          echo "ok $(date -u +%FT%TZ) jdk=$(java -version 2>&1 | head -1)" > build-ci/probe.txt
          git config user.name "arena-build-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f build-ci/probe.txt
          git commit -m "CI probe result [skip ci]" || echo nothing
          git push
